<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';worker-src blob:;style-src 'self' 'unsafe-inline';connect-src 'self';img-src 'self' data:">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <title>SYSTEMS LAB // AB Engineering</title>
  <link rel="stylesheet" href="css/lab-theme.css">
</head>
<body class="grid-bg">
<div class="shell">
<header class="header">
  <div>
    <div class="eyebrow">AB ENGINEERING · SYSTEMS NODE</div>
    <h1>SYSTEMS LAB</h1>
    <p class="subtitle">RUNTIME · WEBASSEMBLY · CONCURRENCY</p>
  </div>
  <div class="status"><i></i>SYSTEM ONLINE</div>
</header>
<main class="layout">
  <aside class="panel matrix">
    <div class="matrix-title">SYSTEMS ENGINES · 02</div>
    <div id="engine-matrix" class="engine-list"></div>
  </aside>
  <section class="panel workspace">
    <div id="engine-viewport" class="viewport"></div>
    <div class="inspector">
      <div>
        <strong id="ins-title">--</strong>
        <span id="ins-tag"></span>
        <p id="ins-desc">--</p>
      </div>
      <div>
        <div id="ins-complexity" class="metric">--</div>
        <div id="ins-metrics" class="metrics"></div>
      </div>
    </div>
  </section>
</main>
</div>
<script src="js/lab-runtime.js"></script>
<script src="js/engines/wasm-benchmark.js"></script>
<script src="js/engines/worker-pool.js"></script>
<script>
labRuntime.registerEngine("wasm",{
  title:"01 · WASM Benchmark",
  tag:"Native WebAssembly",
  shortDesc:"Faktisk WebAssembly-instansiering og målt sammenligning mot JS JIT.",
  concept:"Kompilerer og kjører et in-memory WebAssembly-modul via WebAssembly.instantiate.",
  complexity:"O(N)"
},WasmBenchmarkEngine);

labRuntime.registerEngine("workers",{
  title:"02 · Worker Thread Pool",
  tag:"Native Web Workers",
  shortDesc:"Faktisk parallelisering via browserens Worker API.",
  concept:"Oppretter dedikerte Web Workers og fordeler tunge beregninger utenfor hovedtråden.",
  complexity:"O(N / W)"
},WorkerPoolEngine);

labRuntime.mountEngine("wasm");
</script>
</body>
</html>
